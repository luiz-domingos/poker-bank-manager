<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poker Bank Manager</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container py-5">

        <!-- TÍTULO -->
        <h1 class="main-title">
            ♠ Poker Bank Manager ♠
        </h1>

        <!-- CARDS -->
        <div class="row mb-4">

            <div class="col-md-4 mb-3">

                <div class="main-card text-center">

                    <h5>Total de Sessões</h5>

                    <h2 id="totalSessions">
                        0
                    </h2>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="main-card text-center">

                    <h5>Lucro Total</h5>

                    <h2
                        id="totalProfit"
                        class="text-success"
                    >
                        R$ 0
                    </h2>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="main-card text-center">

                    <h5>Maior Win</h5>

                    <h2
                        id="bestSession"
                        class="text-warning"
                    >
                        R$ 0
                    </h2>

                </div>

            </div>

        </div>

        <!-- FORMULÁRIO -->
        <div class="main-card">

            <h3 class="mb-4">
                Registrar Sessão
            </h3>

            <form id="sessionForm">

                <div class="row">

                    <!-- DATA -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input
                            type="date"
                            class="form-control"
                            id="session_date"
                            required
                        >

                    </div>

                    <!-- SALA -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Sala
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="room"
                            placeholder="Ex: PokerStars"
                            required
                        >

                    </div>

                    <!-- MODALIDADE -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Modalidade
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="game_type"
                            placeholder="Ex: Cash Game"
                            required
                        >

                    </div>

                    <!-- STAKE -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Stake
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="stake"
                            placeholder="Ex: NL10"
                            required
                        >

                    </div>

                    <!-- BUY IN -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Buy-in
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="buy_in"
                            placeholder="100"
                            required
                        >

                    </div>

                    <!-- CASH OUT -->
                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Cash-out
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="cash_out"
                            placeholder="150"
                            required
                        >

                    </div>

                    <!-- LUCRO -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Lucro
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="profit"
                            readonly
                        >

                    </div>

                    <!-- OBSERVAÇÕES -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Observações
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="notes"
                            placeholder="Anotações da sessão"
                        >

                    </div>

                </div>

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    💰 Salvar Sessão
                </button>

            </form>

        </div>

        <!-- TABELA -->
        <div class="main-card">

            <h3 class="mb-4">
                Histórico de Sessões
            </h3>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Data</th>

                            <th>Sala</th>

                            <th>Modalidade</th>

                            <th>Stake</th>

                            <th>Buy-in</th>

                            <th>Cash-out</th>

                            <th>Lucro</th>

                            <th>Observações</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="sessionsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- SCRIPT -->
    <script src="script.js"></script>

</body>

</html>
