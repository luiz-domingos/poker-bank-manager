<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poker Bank Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Poker Bank Manager
        </h1>

        <!-- FORMULÁRIO -->
        <div class="card p-4 mb-4">

            <h3>Cadastrar Sessão</h3>

            <form id="sessionForm">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>Data</label>
                        <input type="date" class="form-control" id="date" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Sala</label>
                        <input type="text" class="form-control" id="room" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Modalidade</label>
                        <input type="text" class="form-control" id="game_type" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Stake</label>
                        <input type="text" class="form-control" id="stake" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Buy-in</label>
                        <input type="number" class="form-control" id="buy_in" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Cash-out</label>
                        <input type="number" class="form-control" id="cash_out" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Lucro</label>
                        <input type="number" class="form-control" id="profit" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Observações</label>
                        <input type="text" class="form-control" id="notes">
                    </div>

                </div>

                <button type="submit" class="btn btn-success">
                    Salvar Sessão
                </button>

            </form>

        </div>

        <!-- TABELA -->
        <div class="card p-4">

            <h3>Histórico de Sessões</h3>

            <table class="table table-striped mt-3">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Sala</th>
                        <th>Stake</th>
                        <th>Lucro</th>
                    </tr>
                </thead>

                <tbody id="sessionTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
