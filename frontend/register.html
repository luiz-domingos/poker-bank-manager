<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Criar Conta
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div
        class="container d-flex
        justify-content-center
        align-items-center"
        style="min-height: 100vh;"
    >

        <div
            class="main-card"
            style="width: 420px;"
        >

            <!-- TÍTULO -->
            <h1 class="main-title mb-2">

                ♠ Criar Conta ♠

            </h1>

            <p
                class="text-center mb-4"
                style="
                    color: #94a3b8;
                "
            >

                Registre um novo usuário

            </p>

            <!-- FORM -->
            <form id="registerForm">

                <!-- USUÁRIO -->
                <div class="mb-3">

                    <label class="form-label">

                        Usuário

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        required
                    >

                </div>

                <!-- SENHA -->
                <div class="mb-3">

                    <label class="form-label">

                        Senha

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        required
                    >

                </div>

                <!-- CONFIRMAR -->
                <div class="mb-4">

                    <label class="form-label">

                        Confirmar Senha

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="confirmPassword"
                        required
                    >

                </div>

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn btn-success w-100"
                >

                    Criar Conta

                </button>

                <p
                    id="message"
                    class="text-center mt-3"
                >
                </p>

            </form>

            <!-- VOLTAR -->
            <div class="text-center mt-4">

                <a
                    href="login.html"
                    class="text-light"
                >

                    Voltar para Login

                </a>

            </div>

        </div>

    </div>

    <script src="register.js"></script>

</body>

</html>
